# Grafana Tempo 2.x -- single binary, traces stored in an S3 bucket.
# metrics_generator derives RED metrics + the service graph from spans and
# remote-writes them to Mimir (with exemplars), powering the service map and
# trace -> metrics links in Grafana.
# local-blocks additionally enables TraceQL metrics queries and Grafana's
# Traces Drilldown (Explore Traces) app.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9097
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h     # 7 days

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      peer_attributes: [peer.service, db.name, db.system]
    span_metrics:
      dimensions: [http.method, http.route, http.status_code]
    local_blocks:
      filter_server_spans: false   # keep client/internal spans so TraceQL metrics see them
      flush_to_storage: true       # write blocks to S3 so queries can cover older data

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_BUCKET}
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      access_key: ${S3_ACCESS_KEY}
      secret_key: ${S3_SECRET_KEY}
      insecure: ${S3_INSECURE}
      forcepathstyle: true
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
