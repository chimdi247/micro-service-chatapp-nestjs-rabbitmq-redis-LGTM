# OpenTelemetry Collector (contrib) -- the single OTLP entry point for all
# application telemetry:
#
#   services --OTLP/HTTP--> collector --> traces  -> Tempo  (OTLP gRPC)
#                                     --> metrics -> Mimir  (Prometheus remote write)
#                                     --> logs    -> Loki   (native OTLP)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    send_batch_size: 4096
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/v1/push
    # Keep OTel metric names exactly as defined in code (no unit/_total
    # suffixes) so dashboards and alerts query stable names, e.g.
    # chatapp_http_server_requests, chatapp_http_server_duration_bucket.
    add_metric_suffixes: false
    # service.name -> job, service.instance.id -> instance (automatic).
    resource_to_telemetry_conversion:
      enabled: false
    target_info:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite/mimir]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
