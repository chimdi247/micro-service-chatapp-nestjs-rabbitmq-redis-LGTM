; PgBouncer in front of user-db (PostgreSQL). user-service connects here.
; Transaction pooling: a server connection is held only for the duration of a
; transaction, so 1000 client connections can share ~20 real PostgreSQL ones.
[databases]
chatapp_user_service = host=user-db port=5432 dbname=chatapp_user_service

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
; no unix socket (container runs unprivileged)
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; The app user may also use the admin console ("pgbouncer" database), which the
; pgbouncer-exporter queries for SHOW STATS / SHOW POOLS.
admin_users = chatapp_user
stats_users = chatapp_user

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options

log_connections = 0
log_disconnections = 0
stats_period = 15
