# Grafana Loki 3.x -- single binary, TSDB index + chunks in an S3 bucket.
# Receives logs from the OTel Collector over native OTLP (/otlp/v1/logs).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  instance_addr: 127.0.0.1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      bucketnames: ${LOKI_BUCKET}
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      s3forcepathstyle: true
      insecure: ${S3_INSECURE}

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

ingester:
  wal:
    dir: /loki/wal            # WAL on the persistent volume survives restarts

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

limits_config:
  retention_period: 168h      # 7 days
  allow_structured_metadata: true   # required for OTLP (trace_id, span_id, attributes)
  volume_enabled: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
