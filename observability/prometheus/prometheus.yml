# Prometheus in AGENT mode: it only scrapes targets and remote-writes to Mimir
# (no local TSDB/query). Mimir is the single metrics store Grafana queries.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

remote_write:
  - url: http://mimir:9009/api/v1/push
    queue_config:
      max_samples_per_send: 5000

scrape_configs:
  # ---------------------------------------------------------------- host / containers
  - job_name: node-exporter
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]

  # ---------------------------------------------------------------- datastores
  - job_name: postgres-primary
    static_configs: [{ targets: ["postgres-exporter-primary:9187"], labels: { role: primary } }]

  - job_name: postgres-replica
    static_configs: [{ targets: ["postgres-exporter-replica:9187"], labels: { role: replica } }]

  - job_name: pgbouncer
    static_configs: [{ targets: ["pgbouncer-exporter:9127"] }]

  - job_name: mysql
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]

  - job_name: proxysql
    metrics_path: /metrics
    static_configs: [{ targets: ["proxysql:6070"] }]

  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]

  # RabbitMQ built-in Prometheus plugin: aggregated + per-queue (detailed).
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]

  - job_name: rabbitmq-detailed
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_metrics]
    static_configs: [{ targets: ["rabbitmq:15692"] }]

  # ---------------------------------------------------------------- uptime probes
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://gateway-service:4000/health"]
        labels: { service: gateway-service }
      - targets: ["http://auth-service:4003/health"]
        labels: { service: auth-service }
      - targets: ["http://user-service:4001/health"]
        labels: { service: user-service }
      - targets: ["http://chat-service:4002/health"]
        labels: { service: chat-service }
      - targets: ["http://client:80/"]
        labels: { service: client }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---------------------------------------------------------------- observability stack itself
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
  - job_name: mimir
    static_configs: [{ targets: ["mimir:9009"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
